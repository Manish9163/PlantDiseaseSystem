services:
  - type: web
    name: plant-disease-detector
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_interface:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
